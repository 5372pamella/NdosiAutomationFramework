name: Ndosi Selenium Automation Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  automation-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Run Selenium TestNG Tests
        run: mvn clean test

      - name: Upload Test Reports and Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ndosi-test-results
          path: |
            test-output/
            target/surefire-reports/
          if-no-files-found: warn
